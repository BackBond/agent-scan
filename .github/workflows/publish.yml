name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish @backbond/agent-scan
    runs-on: ubuntu-latest
    environment: npm

    steps:
      - name: Check out the release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Require a history-clean public repository
        run: node scripts/assert-clean-history.js

      - name: Install an OIDC-capable npm CLI
        run: npm install --global "npm@^11.5.1"

      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: >-
          node -e "const version=require('./package.json').version;
          const tag=process.env.RELEASE_TAG;
          const releaseVersion=tag.startsWith('v') ? tag.slice(1) : tag;
          if (version !== releaseVersion) {
            throw new Error('Release tag ' + tag + ' does not match package version ' + version);
          }"

      - name: Run the complete test suite
        run: node --test

      - name: Enforce the public package boundary
        run: npm run test:public-boundary

      - name: Inspect the package contents
        run: npm pack --dry-run --json

      - name: Publish with npm trusted publishing and provenance
        run: npm publish --access public --provenance
