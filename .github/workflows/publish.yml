name: Publish to npm

on:
  push:
    tags:
      - "v*"
      - "publish-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish @backbond/agent-scan
    runs-on: ubuntu-latest
    environment: npm

    steps:
      - name: Resolve the immutable release tag
        env:
          REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        shell: bash
        run: |
          release_tag="$REQUESTED_TAG"
          if [[ "$release_tag" =~ ^publish-(v[0-9]+\.[0-9]+\.[0-9]+)-r[0-9]+$ ]]; then
            release_tag="${BASH_REMATCH[1]}"
          elif [[ "$release_tag" == publish-v* ]]; then
            release_tag="${release_tag#publish-}"
          fi
          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"

      - name: Require an existing version tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release ref must be a version tag, not a branch or arbitrary ref: $RELEASE_TAG" >&2
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null

      - name: Check out the release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ format('refs/tags/{0}', env.RELEASE_TAG) }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify checkout is the tagged commit
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$(git rev-parse "$RELEASE_TAG^{commit}")"

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Require a history-clean public repository
        run: node scripts/assert-clean-history.js

      - name: Install an OIDC-capable npm CLI
        run: npm install --global "npm@12.0.2"

      - name: Verify release tag matches package version
        run: >-
          node -e "const version=require('./package.json').version;
          const tag=process.env.RELEASE_TAG;
          const releaseVersion=tag.startsWith('v') ? tag.slice(1) : tag;
          if (version !== releaseVersion) {
            throw new Error('Release tag ' + tag + ' does not match package version ' + version);
          }"

      - name: Install the checksum-pinned official MCP publisher
        shell: bash
        run: |
          curl --fail --location --silent --show-error \
            "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz" \
            --output mcp-publisher_linux_amd64.tar.gz
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  mcp-publisher_linux_amd64.tar.gz" | sha256sum --check --strict
          tar -xzf mcp-publisher_linux_amd64.tar.gz mcp-publisher
          chmod 0755 mcp-publisher

      - name: Validate official MCP Registry metadata
        run: ./mcp-publisher validate server.json

      - name: Run the complete test suite
        run: node --test

      - name: Enforce the public package boundary
        run: npm run test:public-boundary

      - name: Pack the exact release tarball
        id: pack
        shell: bash
        run: |
          package_file=$(node -p "'backbond-agent-scan-' + require('./package.json').version + '.tgz'")
          npm pack --json
          echo "file=$package_file" >> "$GITHUB_OUTPUT"

      - name: Publish with npm token fallback and verify registry bytes
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "@backbond/agent-scan@$version" version --json >/dev/null 2>&1; then
            echo "@backbond/agent-scan@$version is already published; verifying exact bytes."
          else
            npm publish "${{ steps.pack.outputs.file }}" --access public --provenance
          fi
          mkdir registry-copy
          registry_file="${{ steps.pack.outputs.file }}"
          for attempt in 1 2 3 4 5 6; do
            if npm pack "@backbond/agent-scan@$version" --pack-destination registry-copy --silent >/dev/null; then
              break
            fi
            sleep 5
          done
          test -f "registry-copy/$registry_file"
          mkdir source-tree registry-tree
          tar -xzf "${{ steps.pack.outputs.file }}" -C source-tree
          tar -xzf "registry-copy/$registry_file" -C registry-tree
          if ! diff -qr --strip-trailing-cr source-tree/package registry-tree/package; then
            echo "Refusing release: tagged package contents differ from the npm registry artifact." >&2
            exit 1
          fi
          cp "registry-copy/$registry_file" "${{ steps.pack.outputs.file }}"
          sha256sum "${{ steps.pack.outputs.file }}" > "${{ steps.pack.outputs.file }}.sha256"

      - name: Create the GitHub release with the exact npm tarball
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          package_file="${{ steps.pack.outputs.file }}"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            assets=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
            mkdir release-assets
            if grep -Fxq "$package_file" <<<"$assets"; then
              gh release download "$RELEASE_TAG" --pattern "$package_file" --dir release-assets
              cmp -s "$package_file" "release-assets/$package_file" || {
                echo "Refusing release: existing GitHub tarball differs from the npm artifact." >&2
                exit 1
              }
            else
              gh release upload "$RELEASE_TAG" "$package_file"
            fi
            if grep -Fxq "$package_file.sha256" <<<"$assets"; then
              gh release download "$RELEASE_TAG" --pattern "$package_file.sha256" --dir release-assets
              cmp -s "$package_file.sha256" "release-assets/$package_file.sha256" || {
                echo "Refusing release: existing GitHub checksum differs from the npm artifact checksum." >&2
                exit 1
              }
            else
              gh release upload "$RELEASE_TAG" "$package_file.sha256"
            fi
          else
            gh release create "$RELEASE_TAG" "$package_file" "$package_file.sha256" \
              --verify-tag --generate-notes --title "$RELEASE_TAG"
          fi

      - name: Check the exact official MCP Registry version
        id: registry
        run: node scripts/check-mcp-registry.js

      - name: Authenticate to the official MCP Registry with GitHub OIDC
        if: steps.registry.outputs.published != 'true'
        run: ./mcp-publisher login github-oidc --registry https://registry.modelcontextprotocol.io

      - name: Publish to the official MCP Registry
        if: steps.registry.outputs.published != 'true'
        run: ./mcp-publisher publish server.json

      - name: Verify the published official MCP Registry version
        shell: bash
        run: |
          for attempt in 1 2 3 4 5 6; do
            if node scripts/check-mcp-registry.js --require-published; then
              exit 0
            fi
            sleep 5
          done
          echo "Published MCP Registry version was not observable after 30 seconds." >&2
          exit 1
