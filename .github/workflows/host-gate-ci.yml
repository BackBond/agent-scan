name: host-gate-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  standalone:
    name: standalone (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ["18", "24"]
    defaults:
      run:
        working-directory: host-gate
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Check public history
        run: node ../scripts/assert-clean-history.js
      - name: Report runtime
        run: node --version
      - name: Test standalone with no network on Linux
        if: runner.os == 'Linux'
        run: sudo unshare --net -- "$(command -v node)" scripts/verify-release.mjs
      - name: Test standalone on Windows
        if: runner.os == 'Windows'
        run: node scripts/verify-release.mjs
      - name: Build and report deterministic hashes
        run: node scripts/build-release.mjs
