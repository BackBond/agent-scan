name: BackBond Agent Scan
description: Vet committed MCP and AI-agent tool manifests before attachment with deterministic local rules.
inputs:
  mode:
    description: Use scan for the broader evidence gate or vet-tools for a strict pre-attachment schema check.
    required: false
    default: scan
  tool-schema:
    description: Repository-relative tool schema or tools/list JSON file.
    required: false
  permissions:
    description: Repository-relative backbond-permissions/v1 JSON file.
    required: false
  trace:
    description: Repository-relative BackBond or OpenTelemetry trace JSON file.
    required: false
  config:
    description: Repository-relative supported agent or MCP config file.
    required: false
  record-path:
    description: Repository-relative output path for the redacted public record.
    required: false
    default: backbond-scan-record.json
  fail-on:
    description: Runtime-exposure severity threshold.
    required: false
    default: high
  fail-on-prompt:
    description: Prompt-lint severity threshold.
    required: false
    default: none
  sarif-path:
    description: Optional repository-relative SARIF output path. In vet-tools mode only; never uploaded automatically.
    required: false
outputs:
  decision:
    description: Pre-attachment decision in vet-tools mode; empty in scan mode.
  coverage-status:
    description: Coverage status reported by the selected mode.
  finding-count:
    description: Number of findings reported by the selected mode.
  ruleset-sha256:
    description: Public ruleset digest used by the selected mode.
  profile-sha256:
    description: Canonical pre-attachment profile digest in vet-tools mode; empty in scan mode.
  record-path:
    description: Absolute path of the generated redacted public record in scan mode; empty in vet-tools mode.
  record-sha256:
    description: Integrity digest of the generated public record.
  commit:
    description: Git commit verified by this Action before scanning.
  sarif-path:
    description: Absolute path of the optional SARIF file; empty unless sarif-path was requested.
runs:
  using: node20
  main: action/index.js
branding:
  icon: shield
  color: blue
