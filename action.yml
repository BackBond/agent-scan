name: 'BackBond Agent Runtime Analysis'
description: 'Capture agent evidence and optionally execute a separately provisioned analyzer; analysis is not included.'
author: 'BackBond'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  assessment:
    description: 'Path to a backbond-agent-teaser/v4 JSON claim document'
    required: true
  analyzer:
    description: 'Path to a separately trusted analyzer executable; this file will run with runner permissions'
    required: true
  analyzer-sha256:
    description: 'Caller-trusted SHA-256 byte-identity pin; this does not authenticate the analyzer publisher or safety'
    required: true
  tool-schema:
    description: 'Optional path to a tool/function schema JSON file'
    required: false
    default: ''
  permissions:
    description: 'Optional path to a runtime permission/control JSON file'
    required: false
    default: ''
  trace:
    description: 'Optional path to a runtime trace JSON file'
    required: false
    default: ''
  receipt:
    description: 'Output path for the capture receipt'
    required: false
    default: 'backbond-capture-receipt.json'
  min-score:
    description: 'Fail when the private analyzer score is below this value. Empty means never fail.'
    required: false
    default: ''

outputs:
  score:
    description: 'Analyzer-reported score; the public client does not authenticate the analyzer publisher'
    value: ${{ steps.scan.outputs.score }}
  disposition:
    description: 'Private analyzer control disposition'
    value: ${{ steps.scan.outputs.disposition }}
  receipt:
    description: 'Capture receipt path'
    value: ${{ inputs.receipt }}

runs:
  using: 'composite'
  steps:
    - id: scan
      shell: bash
      env:
        BACKBOND_ASSESSMENT: ${{ inputs.assessment }}
        BACKBOND_ANALYZER: ${{ inputs.analyzer }}
        BACKBOND_ANALYZER_SHA256: ${{ inputs.analyzer-sha256 }}
        BACKBOND_TOOL_SCHEMA: ${{ inputs.tool-schema }}
        BACKBOND_PERMISSIONS: ${{ inputs.permissions }}
        BACKBOND_TRACE: ${{ inputs.trace }}
        BACKBOND_RECEIPT: ${{ inputs.receipt }}
        BACKBOND_MIN_SCORE: ${{ inputs.min-score }}
      run: |
        set -euo pipefail
        args=(scan --input "$BACKBOND_ASSESSMENT" --analyzer "$BACKBOND_ANALYZER" --analyzer-sha256 "$BACKBOND_ANALYZER_SHA256" --receipt "$BACKBOND_RECEIPT" --json)
        [[ -n "$BACKBOND_TOOL_SCHEMA" ]] && args+=(--tool-schema "$BACKBOND_TOOL_SCHEMA")
        [[ -n "$BACKBOND_PERMISSIONS" ]] && args+=(--permissions "$BACKBOND_PERMISSIONS")
        [[ -n "$BACKBOND_TRACE" ]] && args+=(--trace "$BACKBOND_TRACE")
        out=$(node "$GITHUB_ACTION_PATH/bin/agent-scan.js" "${args[@]}")
        echo "$out"
        score=$(echo "$out" | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>console.log(JSON.parse(d).analysis.score))')
        disposition=$(echo "$out" | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>console.log(JSON.parse(d).analysis.controls.disposition||""))')
        echo "score=$score" >> "$GITHUB_OUTPUT"
        echo "disposition=$disposition" >> "$GITHUB_OUTPUT"
        if [[ -n "$BACKBOND_MIN_SCORE" ]] && (( score < BACKBOND_MIN_SCORE )); then
          echo "Analyzer-reported score $score is below required minimum $BACKBOND_MIN_SCORE" >&2
          exit 1
        fi
