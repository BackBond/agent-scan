name: BackBond Schema Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  schema-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - id: backbond
        uses: BackBond/agent-scan@v0.5.10
        with:
          mode: vet-tools
          tool-schema: tools-list.json
